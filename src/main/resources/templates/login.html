<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign In - Meridian Insurance Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="topbar">Meridian <span>Insurance Portal</span></div>
  <div class="container">
    <div class="card">
      <h1>Sign in</h1>
      <p class="subtitle">Access your policy, claims, and payment dashboard.</p>

      <div class="msg success" th:if="${param.registered}">
        Account created. Please sign in below.
      </div>
      <div class="msg success" th:if="${param.logout}">
        You've been signed out.
      </div>
      <div class="msg error" th:if="${param.error}">
        Invalid username or password.
      </div>

      <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Sign In</button>
      </form>

      <div class="footer-link">
        New here? <a th:href="@{/register}">Create an account</a>
      </div>
    </div>
  </div>
</body>
</html>
