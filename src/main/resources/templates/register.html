<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register - Meridian Insurance Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="topbar">Meridian <span>Insurance Portal</span></div>
  <div class="container">
    <div class="card">
      <h1>Create your account</h1>
      <p class="subtitle">Register to manage your policies online.</p>

      <div class="msg error" th:if="${error}" th:text="${error}"></div>

      <form th:action="@{/register}" th:object="${user}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required minlength="6">

        <button type="submit">Create Account</button>
      </form>

      <div class="footer-link">
        Already registered? <a th:href="@{/login}">Sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
