spring.application.name=insurance-login-app
server.port=8080

# ---- LOCAL (tonight) - H2 in-memory DB, no install needed ----
spring.datasource.url=jdbc:h2:mem:insurancedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- PHASE 3 (later) - swap the block above for this, pointing at AWS RDS ----
# spring.datasource.url=jdbc:mysql://<your-rds-endpoint>:3306/insurancedb
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#
# Note: DB_USERNAME / DB_PASSWORD would come from environment variables or
# Ansible-templated config, never hardcoded - matches how your real project
# keeps DB creds out of source control.

logging.level.org.springframework.security=INFO
